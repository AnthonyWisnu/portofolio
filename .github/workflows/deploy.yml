name: Deploy Portofolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-portofolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vps-portofolio]

    steps:
      - name: Deploy Local PM2 Instance
        run: |
          (
            flock -x -w 300 200 || { echo "ERROR: Another deployment is active in server"; exit 1; }

            set -e
            export PATH="/usr/local/bin:/usr/bin:$PATH"

            cd /home/anthony/portofolio

            rm -f .git/index.lock

            echo "=== 1. Fetching latest main ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2. Installing dependencies ==="
            npm install

            echo "=== 3. Building Next.js production bundle ==="
            nice -n 10 npm run build

            echo "=== 4. Reloading PM2 portofolio ==="
            pm2 describe portofolio > /dev/null \
              && pm2 reload portofolio --update-env \
              || pm2 start npm --name portofolio -- start -- -p 3000

            pm2 save
            echo "=== Deployment Portofolio Completed Successfully ==="
          ) 200>/tmp/portofolio_deploy.lock
