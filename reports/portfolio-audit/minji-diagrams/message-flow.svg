<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8da7ff" stroke-width="1.5"/></marker></defs><rect width="1600" height="1000" fill="#0b0d12"/><g font-family="Segoe UI, Arial, sans-serif"><text x="80" y="130" font-size="54" font-weight="650" fill="#f3f4f6">Alur pesan MinjiBot</text><text x="80" y="188" font-size="26" font-weight="400" fill="#a1a8b8">Dari koneksi WhatsApp hingga eksekusi perintah.</text><path d="M80 230 H1520" stroke="#2b354b"/><rect x="80" y="300" width="420" height="170" rx="14" fill="#141a27" stroke="#2b354b"/><text x="108" y="358" font-size="29" font-weight="600" fill="#8da7ff">WhatsApp / Baileys</text><text x="108" y="408" font-size="22" font-weight="400" fill="#a1a8b8">Menerima pesan dan event grup</text><path d="M510 385 L570 385" fill="none" stroke="#8da7ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="590" y="300" width="420" height="170" rx="14" fill="#141a27" stroke="#2b354b"/><text x="618" y="358" font-size="29" font-weight="600" fill="#8da7ff">Router dan pemeriksaan izin</text><text x="618" y="408" font-size="22" font-weight="400" fill="#a1a8b8">Memilih handler yang sesuai</text><path d="M1020 385 L1080 385" fill="none" stroke="#8da7ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="1100" y="300" width="420" height="170" rx="14" fill="#141a27" stroke="#2b354b"/><text x="1128" y="358" font-size="29" font-weight="600" fill="#8da7ff">Eksekusi perintah</text><text x="1128" y="408" font-size="22" font-weight="400" fill="#a1a8b8">Moderasi, utilitas, dan media</text><path d="M800 482 L800 570" fill="none" stroke="#8da7ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="590" width="420" height="170" rx="14" fill="#141a27" stroke="#2b354b"/><text x="108" y="648" font-size="29" font-weight="600" fill="#92d9b4">Konteks grup</text><text x="108" y="698