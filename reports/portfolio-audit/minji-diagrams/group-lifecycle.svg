<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8da7ff" stroke-width="1.5"/></marker></defs><rect width="1600" height="1000" fill="#0b0d12"/><g font-family="Segoe UI, Arial, sans-serif"><text x="80" y="130" font-size="54" font-weight="650" fill="#f3f4f6">Siklus sewa per grup</text><text x="80" y="188" font-size="26" font-weight="400" fill="#a1a8b8">Status eksplisit untuk pengelolaan akses bot.</text><path d="M80 230 H1520" stroke="#2b354b"/><rect x="80" y="340" width="320" height="170" rx="14" fill="#141a27" stroke="#2b354b"/><text x="108" y="398" font-size="29" font-weight="600" fill="#8da7ff">PENDING</text><text x="108" y="448" font-size="22" font-weight="400" fill="#a1a8b8">Belum aktif</text><path d="M410 425 L443 425" fill="none" stroke="#8da7ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="455" y="340" width="320" height="170" rx="14" fill="#141a27" stroke="#2b354b"/><text x="483" y="398" font-size="29" font-weight="600" fill="#92d9b4">ACTIVE</text><text x="483" y="448" font-size="22" font-weight="400" fill="#a1a8b8">Sewa aktif</text><path d="M785 425 L818 425" fill="none" stroke="#8da7ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="340" width="320" height="170" rx="14" fill="#141a27" stroke="#2b354b"/><text x="858" y="398" font-size="29" font-weight="600" fill="#8da7ff">EXPIRED</text><text x="858" y="448" font-size="22" font-weight="400" fill="#a1a8b8">Masa sewa berakhir</text><path d="M1160 425 L1193 425" fill="none" stroke="#8da7ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="1205" y="340" width="315" height="170" rx="14" fill="#141a27" stroke="#2b354b"/><text x="1233" y="398" font-size="29" font-weight="600" fill="#8da7ff">REMOVED</text><text x="1233" y="448" font-size="22" font-weight="400" fill="#a1a8b8">Status dihapus</text><text x="80" y="640" font-size="36" font-weight="600" fill="#f3f4f6">Setiap grup memiliki konteks sendiri.</text><text x="80" y="700" font-size="27" font-weight="400" fill="#a1a8b8">Peran, saldo, batas pakai, dan pengaturan moderasi mengikuti konteks grup.</text><text x="80" y="758" font-size="27" font-weight="400" fill="#a1a8b8">Pemeriksaan izin dilakukan sebelum perintah dijalankan.</text><path d="M80 884 H1520" stroke="#2b354b"/><text x="80" y="938" font-size="22" font-weight="400" fill="#a1a8b8">MinjiBot / Diagram penjelasan berdasarkan arsitektur kode, bukan screenshot aplikasi.</text></g></svg>